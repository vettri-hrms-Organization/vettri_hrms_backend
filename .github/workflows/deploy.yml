name: Deploy Vettri HRMS Backend

on:
  push:
    branches:
      - main

concurrency:
  group: vettri-production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===================================="
            echo "Vettri HRMS deployment started"
            echo "===================================="

            cd /home/ubuntu/vettri_hrms_backend

            echo "Fetching latest code..."
            git fetch origin main

            echo "Updating working tree..."
            git reset --hard origin/main

            echo "Building backend..."
            mvn clean package -DskipTests

            echo "Restarting backend..."
            sudo systemctl restart vettri-backend

            echo "Waiting for backend..."
            sleep 5

            echo "Checking backend..."
            sudo systemctl is-active --quiet vettri-backend

            echo "===================================="
            echo "Vettri HRMS deployment successful"
            echo "===================================="
