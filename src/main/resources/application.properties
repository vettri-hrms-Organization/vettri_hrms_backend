spring.application.name=haodaone-backend
app.timezone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

# Ask Vettri calls Ollama only from the backend. Intent selection is allow-listed
# by the server, and only server-grounded guidance is sent for natural-language
# rewriting. No employee identifiers, credentials, or browser-supplied roles
# are sent to the model.
app.assistant.ai.provider=${AI_PROVIDER:ollama}
app.assistant.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.assistant.ai.ollama.model=${OLLAMA_MODEL:gpt-oss:20b}
app.assistant.ai.ollama.temperature=${OLLAMA_TEMPERATURE:0.2}
app.assistant.ai.ollama.max-tokens=${OLLAMA_MAX_TOKENS:512}
app.assistant.ai.ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:10s}
app.assistant.ai.ollama.read-timeout=${OLLAMA_READ_TIMEOUT:${OLLAMA_TIMEOUT_MS:180s}}
# ==========================================================
# PostgreSQL - standalone HRMS database
# ==========================================================
# Set DB_URL, DB_USERNAME, and DB_PASSWORD independently on the HRMS
# Render service. DB_URL must be a JDBC PostgreSQL URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
# validate (not update): Flyway owns the standalone HRMS schema and
# Hibernate confirms that the entity mappings remain aligned with it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================================
# Flyway - applies the standalone initial schema on startup
# ==========================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.table=flyway_schema_history_haodaone
spring.flyway.locations=classpath:db/migration

# ============================================I==============
# Server
# ==========================================================
server.port=${PORT:8080}
# Behind Render's proxy: take the client IP from X-Forwarded-For (trusted internal proxies only)
# so login history, rate limits and the ADMS IP allowlist see the real address.
server.forward-headers-strategy=native
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.webrtc.turn.urls=${TURN_URLS:}
app.webrtc.turn.username=${TURN_USERNAME:}
app.webrtc.turn.password=${TURN_PASSWORD:}
app.remote-support.credential-key=${REMOTE_SUPPORT_CREDENTIAL_KEY:}
app.rustdesk.id-server=${RUSTDESK_ID_SERVER:}
app.rustdesk.relay-server=${RUSTDESK_RELAY_SERVER:}
app.rustdesk.public-key=${RUSTDESK_PUBLIC_KEY:}
app.rustdesk.config-string=${RUSTDESK_CONFIG_STRING:}

# Browser attendance location policy. Geofence radius remains configured per office.
attendance.location.good-accuracy-meters=${ATTENDANCE_LOCATION_GOOD_ACCURACY_METERS:100}
attendance.location.max-accuracy-meters=${ATTENDANCE_LOCATION_MAX_ACCURACY_METERS:200}
# Biometric ADMS endpoints fail closed unless exact source IPs are configured.
attendance.adms.allowed-ips=${ADMS_ALLOWED_IPS:}
app.rustdesk.installer-path=${RUSTDESK_INSTALLER_PATH:}
app.rustdesk.installer-sha256=${RUSTDESK_INSTALLER_SHA256:}

# Server-side geocoding proxy. Keep provider credentials/configuration here,
# never in the browser bundle. Nominatim is the default provider.
app.geocoding.provider-url=${GEOCODING_PROVIDER_URL:https://nominatim.openstreetmap.org}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:Vettri-HRMS/1.0}

app.agent-token.otp-expiry-minutes=${AGENT_TOKEN_OTP_EXPIRY_MINUTES:10}
app.agent-token.otp-resend-seconds=${AGENT_TOKEN_OTP_RESEND_SECONDS:60}
app.agent-token.otp-max-resends=${AGENT_TOKEN_OTP_MAX_RESENDS:3}

# ==========================================================
# Resume uploads (Recruitment module - public Careers page)
# ==========================================================
# Migrated off local disk (was ephemeral on Render - see git history for
# the old ResumeStorageService) onto Amazon S3, same pattern as
# HaodaAsset's invoice storage - see ResumeS3StorageService / S3Config.
# Resumes live under the "resumes/" prefix of the SAME bucket
# aws.s3.bucket-name points at below; nothing S3-specific needs
# duplicating here beyond the max-file-size limits.
app.upload.max-resume-size-mb=${MAX_RESUME_SIZE_MB:10}
spring.servlet.multipart.max-file-size=${MAX_RESUME_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${MAX_RESUME_SIZE_MB:10}MB

# Software installer uploads (Windows package management)
# Keep this large enough for real .exe packages while remaining bounded.
app.upload.max-software-package-size-mb=${MAX_SOFTWARE_PACKAGE_SIZE_MB:512}
# The global cap must allow installers; AbuseProtectionFilter limits every other upload to 25 MB.
spring.servlet.multipart.max-file-size=${MAX_SOFTWARE_PACKAGE_SIZE_MB:512}MB
spring.servlet.multipart.max-request-size=${MAX_SOFTWARE_PACKAGE_SIZE_MB:512}MB

# Offer letter uploads (HR, Candidate Details page) - same bucket, own
# "offer-letters/" prefix, see OfferLetterS3StorageService. Shares the
# multipart.max-file-size cap above.
app.upload.max-offer-letter-size-mb=${MAX_OFFER_LETTER_SIZE_MB:10}
app.upload.max-employee-document-size-mb=${MAX_EMPLOYEE_DOCUMENT_SIZE_MB:10}

# ==========================================================
# Amazon S3 (AWS SDK v2) - resume storage, ported from HaodaAsset's
# aws.s3.* / aws.accessKeyId / aws.secretKey convention. Set these env
# vars on HaodaOne's own Render service; they are independent of
# HaodaAsset's - point AWS_S3_BUCKET_NAME at a bucket dedicated to
# HaodaOne (or a shared bucket with a distinct prefix) rather than
# reusing HaodaAsset's invoice bucket.
# ==========================================================
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:haodaone-resumes}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.agent-installer-bucket=${AWS_S3_AGENT_INSTALLER_BUCKET:vettri-software-installer-bucket}
aws.s3.agent-installer-url-expiry-minutes=${AWS_S3_AGENT_INSTALLER_URL_EXPIRY_MINUTES:10}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
aws.s3.presigned-url-expiry-minutes=${AWS_S3_PRESIGNED_URL_EXPIRY_MINUTES:15}
app.storage.employee-document-bucket=${EMPLOYEE_DOCUMENT_S3_BUCKET}

# ==========================================================
# JWT
# ==========================================================
# app.jwt.secret MUST be overridden with a real random 256-bit+ value before
# any real deployment (e.g. `openssl rand -base64 48`). The default below is
# fine for local dev only.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-before-deploying-anywhere-real-1234567890}
app.jwt.access-token-expiry-minutes=${JWT_ACCESS_EXPIRY_MINUTES:15}
app.jwt.refresh-token-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:7}
# Two-factor (TOTP) seeds are AES-256-GCM encrypted with a key derived (HKDF-SHA256)
# from this value; when empty the JWT secret is used instead. Set once and keep
# stable - changing it invalidates existing authenticator enrolments.
app.security.totp-encryption-key=${TOTP_ENCRYPTION_KEY:}
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:60}

# ==========================================================
# CORS
# ==========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://vettrihrms.in,https://app.vettrihrms.in}

# ==========================================================
# Seed data - initial super admin account. CHANGE THE DEFAULT PASSWORD
# before deploying anywhere real; the account is forced to change it on
# first login regardless (mustChangePassword=true).
# ==========================================================
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@haodaone.local}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:ChangeMe123!}

# ==========================================================
# Transactional email (Zoho SMTP - all existing email features)
# ==========================================================
# MAIL_PASSWORD must be a Zoho app-specific password, not the normal
# Zoho account password. Leave it empty only in environments where email
# is intentionally disabled; EmailService will report delivery failure
# without exposing credentials or failing the calling HRMS operation.
spring.mail.host=${MAIL_HOST:smtp.zoho.in}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:customersupport@vettrihrms.in}
spring.mail.password=${ZOHO_MAIL_APP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.email.from-system-address=${EMAIL_FROM_ADDRESS:${MAIL_FROM_SYSTEM:noreply@vettrihrms.in}}
app.email.from-billing-address=${BILLING_FROM_ADDRESS:${MAIL_FROM_BILLING:billing@vettrihrms.in}}
app.email.from-support-address=${MAIL_FROM_SUPPORT:customersupport@vettrihrms.in}
app.email.from-system-name=${EMAIL_FROM_NAME:${MAIL_FROM_SYSTEM_NAME:Vettri HRMS}}
app.email.from-billing-name=${BILLING_FROM_NAME:${MAIL_FROM_BILLING_NAME:Vettri Billing}}
app.email.from-support-name=${MAIL_FROM_SUPPORT_NAME:Vettri Customer Support}
app.account-invitation.expiry-hours=${ACCOUNT_INVITATION_EXPIRY_HOURS:48}
# Base URL of the frontend app, used to build links inside emails (e.g.
# "view candidate" for the hiring manager). No trailing slash.
app.frontend-url=${FRONTEND_URL:${APP_FRONTEND_URL:https://app.vettrihrms.in}}
app.account-token.expiry-hours=${ACCOUNT_TOKEN_EXPIRY_HOURS:24}
app.account-invitation.encryption-key=${ACCOUNT_INVITATION_ENCRYPTION_KEY:${app.jwt.secret}}

# Razorpay standard checkout credentials. Keep the key secret server-side only.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.currency=${RAZORPAY_CURRENCY:INR}

# Single sign-on (OIDC authorization code + PKCE). A provider's button only shows once
# its client id + secret AND app.sso.redirect-base-url (public backend URL, no trailing
# slash) are set. Redirect URI to register: <redirect-base-url>/api/auth/sso/{google|microsoft}/callback
app.sso.google.client-id=${SSO_GOOGLE_CLIENT_ID:}
app.sso.google.client-secret=${SSO_GOOGLE_CLIENT_SECRET:}
app.sso.microsoft.client-id=${SSO_MICROSOFT_CLIENT_ID:}
app.sso.microsoft.client-secret=${SSO_MICROSOFT_CLIENT_SECRET:}
app.sso.microsoft.tenant=${SSO_MICROSOFT_TENANT:common}
app.sso.redirect-base-url=${SSO_REDIRECT_BASE_URL:}

# WhatsApp notifications (Meta WhatsApp Cloud API). Off by default; templates must be
# approved in WhatsApp Manager with three body parameters: {{1}} name, {{2}} title, {{3}} message.
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.language=${WHATSAPP_TEMPLATE_LANGUAGE:en}
app.whatsapp.templates.leave-decision=${WHATSAPP_TEMPLATE_LEAVE_DECISION:}
app.whatsapp.templates.payslip-published=${WHATSAPP_TEMPLATE_PAYSLIP_PUBLISHED:}
app.whatsapp.templates.announcement-urgent=${WHATSAPP_TEMPLATE_ANNOUNCEMENT_URGENT:}
app.whatsapp.templates.expense-decision=${WHATSAPP_TEMPLATE_EXPENSE_DECISION:}
app.whatsapp.templates.check-in-reminder=${WHATSAPP_TEMPLATE_CHECK_IN_REMINDER:}

# Subscription billing / GST tax invoices (all optional). With no seller GSTIN
# invoices print "GSTIN: not provided" and charge no GST. SAC 997331 = licensing
# the right to use software (SaaS subscription).
app.billing.seller-name=${BILLING_SELLER_NAME:}
app.billing.seller-gstin=${BILLING_SELLER_GSTIN:}
app.billing.seller-address=${BILLING_SELLER_ADDRESS:}
app.billing.seller-state-code=${BILLING_SELLER_STATE_CODE:}
app.billing.seller-pan=${BILLING_SELLER_PAN:}
app.billing.seller-sac=${BILLING_SELLER_SAC:997331}
app.billing.invoice-prefix=${BILLING_INVOICE_PREFIX:VTR}
app.billing.grace-days=${BILLING_GRACE_DAYS:7}
app.billing.seat-hard-cap=${BILLING_SEAT_HARD_CAP:0}
app.billing.razorpay-subscriptions-enabled=${BILLING_RAZORPAY_SUBSCRIPTIONS_ENABLED:false}

# ==========================================================
# Logging
# ==========================================================
logging.level.com.haodaone=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN

# ==========================================================
# Privacy / legal documents (DPDP Act 2023). Bumping a *-version forces
# users who must accept that document to re-accept on next login.
# ==========================================================
app.legal.terms-url=${APP_LEGAL_TERMS_URL:https://vettrihrms.in/terms}
app.legal.terms-version=${APP_LEGAL_TERMS_VERSION:2026-10-01}
app.legal.privacy-url=${APP_LEGAL_PRIVACY_URL:https://vettrihrms.in/privacy}
app.legal.privacy-version=${APP_LEGAL_PRIVACY_VERSION:2026-10-01}
app.legal.dpa-url=${APP_LEGAL_DPA_URL:https://vettrihrms.in/dpa}
app.legal.dpa-version=${APP_LEGAL_DPA_VERSION:2026-10-01}
app.legal.acceptable-use-url=${APP_LEGAL_AUP_URL:https://vettrihrms.in/terms#acceptable-use}
app.legal.acceptable-use-version=${APP_LEGAL_AUP_VERSION:2026-10-01}
app.legal.monitoring-notice-url=${APP_LEGAL_MONITORING_NOTICE_URL:https://vettrihrms.in/privacy#employee-monitoring}
app.legal.monitoring-notice-version=${APP_LEGAL_MONITORING_NOTICE_VERSION:2026-10-01}
app.legal.acceptance-enforced=${APP_LEGAL_ACCEPTANCE_ENFORCED:true}
# Physical row purge after a company's 30-day deletion grace period (anonymisation + soft delete always run).
app.privacy.hard-delete-enabled=${APP_PRIVACY_HARD_DELETE_ENABLED:false}
